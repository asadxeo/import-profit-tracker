name: Build Syntex Imports Android APK
on:
  push:
    branches:
      - syntex-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native Flutter Android project
        run: |
          flutter create --org com.syntex --project-name imports --platforms android /tmp/syntex_android
          cp app/lib/main.dart /tmp/syntex_android/lib/main.dart
          install -D app/android/MainActivity.kt /tmp/syntex_android/android/app/src/main/kotlin/com/syntex/imports/MainActivity.kt
          sed -i 's/android:label="imports"/android:label="Syntex Imports"/' /tmp/syntex_android/android/app/src/main/AndroidManifest.xml
          cd /tmp/syntex_android
          flutter pub add intl shared_preferences
      - name: Analyze Flutter source
        continue-on-error: true
        run: |
          cd /tmp/syntex_android
          flutter analyze
      - name: Build installable debug APK
        run: |
          cd /tmp/syntex_android
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SyntexImports-Android-APK
          path: /tmp/syntex_android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
