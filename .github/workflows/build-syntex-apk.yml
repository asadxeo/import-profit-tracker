name: Build Syntex Imports Release APK
on:
  push:
    branches: [syntex-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create native Flutter Android project
        run: |
          flutter create --org com.syntex --project-name imports --platforms android /tmp/syntex_android
          cp app/lib/main.dart /tmp/syntex_android/lib/main.dart
          install -D app/android/MainActivity.kt /tmp/syntex_android/android/app/src/main/kotlin/com/syntex/imports/MainActivity.kt
          sed -i 's/android:label="imports"/android:label="Syntex Imports"/' /tmp/syntex_android/android/app/src/main/AndroidManifest.xml
          cd /tmp/syntex_android
          flutter pub add intl shared_preferences

      - name: Build signed release APK
        run: |
          cd /tmp/syntex_android
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK signature, manifest and application data
        run: |
          set -euo pipefail
          APK=/tmp/syntex_android/build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -25
          unzip -t "$APK" | tail -2
          unzip -l "$APK" | grep 'assets/flutter_assets'
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SyntexImports-Verified-Release-APK
          path: /tmp/syntex_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
